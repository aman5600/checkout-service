# Tests run against the PostgreSQL from docker-compose, in their own database.
# The guarded UPDATE, SKIP LOCKED claiming and the CHECK constraints only exist
# in the database, so testing against anything else would test the wrong thing.
spring.datasource.url=jdbc:postgresql://localhost:5432/checkout_test
spring.datasource.username=checkout
spring.datasource.password=checkout

# Timers are collapsed to zero so tests can drive the jobs directly instead of
# sleeping. The schedulers are pushed out of the way for the same reason: every
# test calls the job method itself, so nothing fires underneath an assertion.
checkout.reconcile-window=PT0S
# Three checks, all immediate, so tests can walk the whole tail without sleeping.
checkout.refund.verify-schedule=PT0S,PT0S,PT0S
checkout.job.interval=PT1H
checkout.refund.interval=PT1H
checkout.job.lease=PT30S
checkout.refund.lease=PT30S
logging.level.com.example.checkout=WARN
